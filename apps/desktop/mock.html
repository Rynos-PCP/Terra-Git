          // would empty the scene and the workshop offer would never appear.

          // diff — empty hunks plus the engine's explanation.

            if (cmd === "get_file_diff") {

              // line endings differ from what a checkout would write.
              // oldEol stays empty — both sides are the same content, so a
              // side-by-side comparison would inevitably be identical (that is
              // what the engine returns too).
              return Promise.resolve({
                reason: "eolOnly",

          if (cmd === "get_range_diff_stream" && args && args.onFile) {
