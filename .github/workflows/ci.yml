# CI: format, Rust tests and clippy across a 3-OS matrix, plus the performance
# budget gate, the cargo-deny supply-chain gate and the frontend gates. The
# purpose: keep all of them equally green on Windows, macOS and Linux.
#
# It builds no bundles — that is release.yml.

name: CI

# Read-only token: CI runs on pull_request, which on a public repo means it
# executes branches from arbitrary forks.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tauri 2 system dependencies (Linux only; tg-app pulls in WebKitGTK 4.1).
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev \
            libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Check the format only once (platform-independent) — saves matrix time.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Clippy first: it is the cheap, deterministic gate, and behind a failing
      # test step it would never run at all.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `if: !cancelled()` so a lint failure still leaves a full test report, and
      # --no-fail-fast because cargo otherwise stops at the first failing test
      # binary — a run would only ever show the topmost layer of a problem. The
      # maintainer develops on Windows and cannot reproduce the Linux and macOS
      # jobs locally, so one run has to report everything that is broken.
      - name: Test
        if: '!cancelled()'
        run: cargo test --workspace --no-fail-fast

  perf:
    name: Performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches catastrophic regressions (hangs/O(n²)) through generous,
      # hardware-tolerant budgets.
      - name: Perf budget gate
        env:
          TG_PERF_FILES: "5000"
        run: cargo test -p tg-git-engine --test perf_budget -- --ignored --nocapture
      # At least compile the benchmarks so they do not bit-rot.
      - name: Compile benchmarks
        run: cargo bench -p tg-git-engine --no-run

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
