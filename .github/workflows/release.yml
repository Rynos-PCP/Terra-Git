# GitHub Actions release: unsigned bundles for Linux/macOS/Windows.
#
# Builds installable artifacts WITHOUT code signing/notarization/auto-update —
# those follow once certificates + minisign keys + update hosting are in place
# (deliberately: no TAURI_SIGNING_PRIVATE_KEY set). Users accept an "unknown
# publisher" warning at startup.
#
# Triggers:
#   - tag `v*`                    -> a draft GitHub release with all artifacts.
#   - manual (workflow_dispatch)  -> build only + downloadable workflow
#     artifacts (the fast way to a test bundle without tagging).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: webkit2gtk-4.1 + broad glibc compatibility of the AppImage.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Tauri 2 system dependencies + patchelf (AppImage) — Linux only.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev \
            libdbus-1-dev pkg-config patchelf libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      # Builds the frontend (beforeBuildCommand) + the Rust release + the bundles.
      # With a tag: create/fill a draft release. Without a tag (dispatch): build only.
      - name: Build app bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('terra-git {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # Always attach the built bundles as downloadable artifacts — that way a
      # manual (tag-less) run also yields an installable package.
      # Cargo workspace: the target lies at the repo root (not under apps/).
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: terra-git-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          # error instead of warn: every OS produces >=1 matching format; an empty
          # match would be a real regression (a wrong path) and should stand out.
          if-no-files-found: error
          retention-days: 14
