# CI pipeline for terra-git (desktop app: Tauri 2 + Svelte 5).
#
# Deliberately NO Auto DevOps (canary/rollout/DAST make no sense for a desktop app).
# Quality gates: format + clippy + Rust tests and frontend lint/check/build.
# Signed Tauri bundles (NSIS/MSI/AppImage/DMG) need platform-specific runners and
# follow as their own release jobs; the GitHub Actions equivalent lives in
# .github/workflows/.

stages:
  - check

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  npm_config_cache: $CI_PROJECT_DIR/.npm-cache

# Rust format + clippy + tests of the Tauri-free crates (fast, without WebKit).
rust:
  stage: check
  image: rust:latest
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target
  script:
    # libdbus: keyring (tg-auth) links against the secret service on Linux.
    - apt-get update -qq && apt-get install -y -qq libdbus-1-dev pkg-config
    - rustup component add rustfmt clippy
    # Format is a hard gate — it applies to ALL crates.
    - cargo fmt --all -- --check
    # Clippy first: the cheap, deterministic gate (as in .github/workflows/ci.yml).
    - cargo clippy -p tg-domain -p tg-git-engine -p tg-auth -p tg-providers --all-targets -- -D warnings
    # --no-fail-fast: one run reports every failing test binary, not just the first.
    - cargo test --no-fail-fast -p tg-domain -p tg-git-engine -p tg-auth -p tg-providers

# tg-app (the Tauri command layer, credential helper, logging/panic hook) is
# compiled/tested separately — otherwise the whole src-tauri code would stay
# unchecked in CI (a former hole: format drift and a red `npm test` could merge
# unnoticed). A compile check, NO bundle creation.
tauri-app:
  stage: check
  image: rust:latest
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target
  script:
    # Tauri 2 system dependencies (WebKitGTK 4.1) + keyring (dbus).
    - apt-get update -qq
    - >-
      apt-get install -y -qq
      libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev
      libdbus-1-dev pkg-config
    - rustup component add clippy
    - cargo clippy -p tg-app --all-targets -- -D warnings
    - cargo test --no-fail-fast -p tg-app

# Performance gate: catches catastrophic regressions (hangs, O(n²)) through
# generous, hardware-tolerant budgets; additionally compiles the criterion
# benchmarks (bit-rot protection). Precise baseline tracking follows.
perf:
  stage: check
  image: rust:latest
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target
  variables:
    TG_PERF_FILES: "5000"
  script:
    - cargo test -p tg-git-engine --test perf_budget -- --ignored --nocapture
    - cargo bench -p tg-git-engine --no-run

# Supply chain gate: RUSTSEC advisories + license compliance (deny.toml).
supply-chain:
  stage: check
  image: rust:latest
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - target
  script:
    - cargo install cargo-deny --locked
    - cargo deny check

frontend:
  stage: check
  image: node:22
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm-cache
  script:
    - cd apps/desktop
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run check
    - npm test
    - npm run build
