# cargo-deny — supply chain gate: advisories, licenses, sources.
# Locally/CI: `cargo deny check`.

[advisories]
# RUSTSEC advisory DB. Known, deliberately accepted advisories in `ignore`
# (triaged 2026-10-26). Exclusively transitive items without an available fix —
# re-evaluate regularly. The gtk-rs "unmaintained" entries were withdrawn
# upstream (2026-08), the unic-* crates left the tree with the 1.1 updates.
yanked = "warn"
# Unsound advisories count for transitive crates too (the default only looks
# at direct dependencies) — accepted ones are listed below with a reason.
unsound = "all"
ignore = [
    # proc-macro-error "unmaintained" — a transitive macro dependency.
    "RUSTSEC-2024-0370",
    # glib 0.18 `VariantStrIter` unsound (GHSA-wrw7-89jp-8q8g) — comes in through
    # Tauri 2 / WebKitGTK (Linux only), fixed in glib 0.20, which needs Tauri's
    # GTK4 migration. No crate in the tree calls `VariantStrIter`.
    "RUSTSEC-2024-0429",
]

[licenses]
# Only these licenses are allowed (anything else fails).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # libgit2-sys (vendored) carries GPL-2.0 WITH a linking exception; the
    # exception permits linking into permissively/proprietarily licensed software.
    "GPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Only warn about multiple versions (e.g. transitively differing reqwest/rustls)
# so the gate does not fail on unavoidable duplicates.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
